<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простая страница</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #202124;
      }

      main {
        width: min(420px, calc(100% - 48px));
        padding: 32px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 { margin-top: 0; }

      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Привет!</h1>
      <p>Это простая HTML-страница.</p>
      <button type="button" onclick="alert('Кнопка нажата!')">Нажми меня</button>
    </main>
  </body>
</html>
